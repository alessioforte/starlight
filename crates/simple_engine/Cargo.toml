[package]
name = "simple_engine"
version.workspace = true
authors.workspace = true
description.workspace = true
readme.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
anyhow = "1"
thiserror = "1"
log = "0.4"
dashmap = "6"
rand = "0.8"
chrono = "0.4"

[dev-dependencies]
tokio-test = "0.4"
env_logger = "0.11"
tempfile = "3"
